<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; worker-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; img-src 'self' data:;"
    />
    <title>Hub Manager</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var theme = savedTheme || 'light';
          var variant = localStorage.getItem('theme-variant') || 'default';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
          }
          ['default', 'midnight', 'nebula', 'cyberpunk', 'nordic'].forEach(function(v) {
            root.classList.remove('theme-' + v);
          });
          root.classList.add('theme-' + variant);
        } catch (e) {}
      })();
    </script>
    <style>
      /* Tela de carregamento: aparece antes de o React montar e some quando ele renderiza dentro de #root */
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: hsl(var(--background, 222.2 84% 4.9%)); }
      #boot svg { width: 88px; height: 88px; border-radius: 22%; color: hsl(var(--primary, 25 100% 50%)); box-shadow: 0 18px 48px -12px hsl(var(--primary, 25 100% 50%) / 0.45); animation: boot-pulse 1.6s ease-in-out infinite; }
      @keyframes boot-pulse { 0%, 100% { opacity: 0.55; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { #boot svg { animation: none; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-foreground antialiased font-sans select-none overflow-hidden transition-colors duration-300">
    <div id="root">
      <div id="boot" role="status" aria-label="Carregando o Hub Manager">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="currentColor" />
          <g transform="translate(12 12) scale(.625)" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
            <path d="M32 5L55.4 18.5L32 32L8.6 18.5Z" fill="#FFFFFF" />
            <path d="M8.6 18.5L32 32V59L8.6 45.5Z" fill="#FFFFFF" fill-opacity="0.72" />
            <path d="M55.4 18.5V45.5L32 59V32Z" fill="#000000" fill-opacity="0.4" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/renderer/src/main.tsx"></script>
  </body>
</html>
